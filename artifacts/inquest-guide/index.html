    <script type="application/ld+json">

          {
            "@type": "Question",
            "name": "What is the purpose of a coroner's inquest?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A coroner's court is inquisitorial, not adversarial. An inquest sets out to establish who the deceased was and how, when and where they came by their death — it does not assign blame or determine criminal or civil liability."
            }
          },
          {
            "@type": "Question",
            "name": "How do I give evidence at an inquest?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Listen to each question, pause before answering, and answer only what is asked. Address the coroner as 'Sir' or 'Madam', keep answers factual and in plain language, and do not leave the witness box until the coroner releases you."
            }
          },
          {
            "@type": "Question",
            "name": "How do I write a statement for the coroner?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Write in the first person, structure it chronologically, and make sure it is typed, signed and dated. Explain any technical terms in plain English, stick to your own factual involvement, and prioritise accuracy over speed."
            }
          },
          {
            "@type": "Question",
            "name": "What is a Prevention of Future Deaths (Regulation 28) report?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "If the evidence suggests further avoidable deaths could occur, the coroner has a duty to issue a Regulation 28 Prevention of Future Deaths report. It is sent to whoever can take preventative action, who must respond within 56 days."
            }
          }
        ]
      }
